<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medix - Cadastro de Pacientes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      cli: { primary: '#6d3cff', hover: '#5a2de0', soft: '#ece6ff', ink: '#1e1442', deep: '#1e1442', lime: '#d4f45a',
        bg: '#f6f4ef', card: '#ffffff', cardHover: '#faf8f3', border: '#e2dccd', subtext: '#6b6485' }
    }}}};
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family:'Figtree',sans-serif;background:#f6f4ef;color:#1e1442; }
    .hero { background:linear-gradient(135deg,#e4dbff 0%,#f6f4ef 100%); }
    .modal { background:#fff;border:1px solid #e2dccd;box-shadow:0 24px 60px rgba(30,20,66,.3); }
    input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid #6d3cff;outline-offset:2px}
  </style>
</head>
<body class="bg-cli-bg text-cli-ink min-h-screen">
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const Icons={
  Cross:({size=24})=><svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>,
  Users:({size=20})=><svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.4c2.2.7 3.5 2.5 3.5 5.6"/></svg>,
  Plus:({size=18})=><svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 5v14M5 12h14"/></svg>,
  Search:({size=18})=><svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>,
  Edit:({size=16})=><svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m15 5 4 4M4 20l4-.8L20 7a2.8 2.8 0 0 0-4-4L4 15z"/></svg>,
  Trash:({size=16})=><svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg>,
  Pulse:({size=22})=><svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></svg>
};
const STATUS={AGUARDANDO:{l:'Aguardando',c:'bg-[#ece6d6] text-cli-ink'},EM_ATENDIMENTO:{l:'Em atendimento',c:'bg-cli-soft text-cli-primary'},ATENDIDO:{l:'Atendido',c:'bg-cli-lime text-cli-ink'}};
const SEXO={FEMININO:'Feminino',MASCULINO:'Masculino',OUTRO:'Outro'};
const EMPTY={nome:'',cpf:'',sexo:'',dataNascimento:'',telefone:'',convenio:'PARTICULAR',tipoSanguineo:'',peso:'',alergias:'',statusAtendimento:'AGUARDANDO',observacoes:''};
const idade=(d)=>{if(!d)return null;const n=new Date(d),h=new Date();if(isNaN(n))return null;let i=h.getFullYear()-n.getFullYear();const m=h.getMonth()-n.getMonth();if(m<0||(m===0&&h.getDate()<n.getDate()))i--;return i>=0?i:null};
function App(){
  const [tela,setTela]=useState('principal');
  const [apiUrl,setApiUrl]=useState('http://localhost:8080/api/pacientes');
  const [urlEdit,setUrlEdit]=useState(apiUrl);
  const [showConfig,setShowConfig]=useState(false);
  const [statusApi,setStatusApi]=useState('carregando');
  const [erroDetalhe,setErroDetalhe]=useState('');
  const [pacientes,setPacientes]=useState([]);
  const [busca,setBusca]=useState('');
  const [filtro,setFiltro]=useState('TODOS');
  const [form,setForm]=useState(EMPTY);
  const [editando,setEditando]=useState(null);
  const [deletando,setDeletando]=useState(null);
  const [toast,setToast]=useState(null);
  const [carregando,setCarregando]=useState(false);
  const avisar=(mensagem,tipo='info')=>{setToast({mensagem,tipo});setTimeout(()=>setToast(null),3800)};
  const request=async(path='',options={})=>{
    const res=await fetch(`${apiUrl.replace(/\/$/,'')}${path}`,options);
    if(!res.ok) throw new Error(`A API respondeu com status ${res.status}`);
    if(res.status===204)return null;
    const text=await res.text(); return text?JSON.parse(text):null;
  };
  const carregarPacientes=async()=>{
    setCarregando(true);setErroDetalhe('');
    try{
      const dados=await request();
      setPacientes(Array.isArray(dados)?dados:(dados?[dados]:[]));
      setStatusApi('conectado');
    }catch(e){setStatusApi('erro');setErroDetalhe(e.message||'Não foi possível conectar à API.');}
    finally{setCarregando(false);}
  };
  useEffect(()=>{carregarPacientes()},[apiUrl]);
  const salvar=async(e)=>{
    e.preventDefault();
    const dados={...form,peso:form.peso===''?null:Number(form.peso)};
    try{
      if(editando!==null){
        await request('/'+editando,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});
        avisar('Paciente atualizado pela API!','sucesso');
      }else{
        await request('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});
        avisar('Paciente cadastrado na API!','sucesso');
      }
      setForm(EMPTY);setEditando(null);setTela('principal');await carregarPacientes();
    }catch(err){avisar(`Não foi possível salvar. ${err.message}`,'erro');}
  };
  const editar=(p)=>{
    setForm({nome:p.nome||'',cpf:p.cpf||'',sexo:p.sexo||'',dataNascimento:p.dataNascimento||'',telefone:p.telefone||'',convenio:p.convenio||'PARTICULAR',tipoSanguineo:p.tipoSanguineo||'',peso:p.peso??'',alergias:p.alergias||'',statusAtendimento:p.statusAtendimento||'AGUARDANDO',observacoes:p.observacoes||''});
    setEditando(p.id);setTela('cadastro');
  };
  const excluir=async(id)=>{
    try{await request('/'+id,{method:'DELETE'});avisar('Paciente excluído pela API!','sucesso');setDeletando(null);await carregarPacientes();}
    catch(err){avisar(`Não foi possível excluir. ${err.message}`,'erro');}
  };
  const novo=()=>{setForm(EMPTY);setEditando(null);setTela('cadastro')};
  const filtrados=useMemo(()=>pacientes.filter(p=>{
    const texto=[p.nome,p.cpf,p.telefone,p.convenio].filter(Boolean).join(' ').toLowerCase();
    return texto.includes(busca.toLowerCase())&&(filtro==='TODOS'||p.statusAtendimento===filtro);
  }),[pacientes,busca,filtro]);
  const aguardando=pacientes.filter(p=>p.statusAtendimento==='AGUARDANDO').length;
  const atendidos=pacientes.filter(p=>p.statusAtendimento==='ATENDIDO').length;
  const field='w-full bg-white border border-cli-border rounded-lg p-3 text-sm text-cli-ink focus:outline-none focus:border-cli-primary focus:ring-2 focus:ring-cli-primary/20 transition';
  const label='block text-cli-subtext font-semibold mb-1.5 text-xs';
  return <div className="flex min-h-screen bg-cli-bg text-cli-ink">
    {toast&&<div className={`fixed top-5 right-5 z-[70] px-4 py-3 rounded-xl text-xs font-semibold shadow-xl border bg-white ${toast.tipo==='sucesso'?'text-cli-primary border-cli-primary/40':toast.tipo==='erro'?'text-rose-700 border-rose-300':'text-cli-ink border-cli-border'}`}>{toast.mensagem}</div>}
    <aside className="w-64 bg-cli-deep text-white p-5 hidden md:flex flex-col justify-between">
      <div className="space-y-8">
        <div className="flex items-center gap-3 px-2"><span className="text-cli-lime"><Icons.Cross size={30}/></span><span className="text-2xl font-extrabold">Medi<span className="text-cli-lime">x</span></span></div>
        <nav className="space-y-2">
          <button onClick={()=>setTela('principal')} className={`w-full flex items-center gap-3 px-3 py-3 rounded-lg text-sm font-bold ${tela==='principal'?'bg-white/10 text-cli-lime':'text-white/60 hover:text-white'}`}><Icons.Users/> Pacientes cadastrados</button>
          <button onClick={novo} className={`w-full flex items-center gap-3 px-3 py-3 rounded-lg text-sm font-bold ${tela==='cadastro'?'bg-white/10 text-cli-lime':'text-white/60 hover:text-white'}`}><Icons.Plus/> Cadastrar paciente</button>
        </nav>
      </div>
      <div className="bg-black/20 p-3 rounded-xl border border-white/10">
        <span className="text-white/60 block text-xs font-semibold mb-1">API Backend</span>
        <div className="text-[11px] font-mono break-all mb-3">{apiUrl}</div>
        <div className="flex items-center justify-between gap-2"><span className="flex items-center gap-2 text-xs"><span className={`w-2 h-2 rounded-full ${statusApi==='conectado'?'bg-cli-lime':statusApi==='carregando'?'bg-amber-400':'bg-rose-500'}`}></span>{statusApi==='conectado'?'Conectada':statusApi==='carregando'?'Conectando':'Erro de conexão'}</span><button onClick={()=>{setUrlEdit(apiUrl);setShowConfig(true)}} className="text-xs text-cli-lime hover:underline">Alterar</button></div>
      </div>
    </aside>
    <main className="flex-1 min-w-0">
      <header className="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-cli-border px-5 md:px-8 py-4 flex items-center justify-between">
        <div className="flex items-center gap-3 md:hidden"><span className="text-cli-primary"><Icons.Cross size={26}/></span><b className="text-xl">Medi<span className="text-cli-primary">x</span></b></div>
        <div className="hidden md:block text-sm text-cli-subtext">Clínica geral / <span className="text-cli-ink font-semibold">{tela==='cadastro'?'Cadastro':'Painel'}</span></div>
        <div className="flex gap-2">
          <button onClick={()=>carregarPacientes()} className="px-3 py-2 rounded-full border border-cli-border text-xs font-bold hover:bg-cli-soft">{carregando?'Atualizando...':'↻ Atualizar'}</button>
          <button onClick={novo} className="flex items-center gap-2 px-4 py-2 rounded-full bg-cli-primary text-white text-xs font-extrabold hover:bg-cli-hover"><Icons.Plus/> Novo paciente</button>
        </div>
      </header>
      <div className="p-5 md:p-8 max-w-7xl mx-auto">
        {tela==='principal'?<>
          <section className="hero rounded-2xl p-7 md:p-10 mb-7 border border-cli-border flex items-center justify-between gap-6">
            <div>
              <p className="text-cli-primary text-sm font-bold mb-2">Saúde mais simples, a partir do cadastro</p>
              <h1 className="text-3xl md:text-5xl font-extrabold tracking-tight mb-3">Cada paciente merece atenção de verdade.</h1>
              <p className="text-cli-subtext max-w-xl text-sm leading-6">Gerencie os pacientes atendidos pela clínica em um só lugar. Os dados são carregados e salvos diretamente na sua API.</p>
            </div>
            <span className="hidden lg:block text-cli-primary/25 shrink-0"><Icons.Pulse size={140}/></span>
          </section>
          {statusApi==='erro'&&<div className="mb-5 rounded-xl border border-rose-300 bg-rose-50 p-4 text-sm"><b className="text-rose-700">Não foi possível conectar à API.</b><p className="text-cli-subtext mt-1">{erroDetalhe}</p><p className="text-cli-subtext mt-1">Confira a URL, se o backend está em execução e se o CORS está configurado.</p><button onClick={()=>{setUrlEdit(apiUrl);setShowConfig(true)}} className="mt-3 text-cli-primary font-bold hover:underline">Configurar endpoint</button></div>}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-7">
            <div className="bg-cli-card border border-cli-border rounded-xl p-5"><p className="text-cli-subtext text-xs font-semibold">Total de pacientes</p><p className="text-3xl font-extrabold mt-2">{pacientes.length}</p></div>
            <div className="bg-cli-card border border-cli-border rounded-xl p-5"><p className="text-cli-subtext text-xs font-semibold">Aguardando atendimento</p><p className="text-3xl font-extrabold mt-2 text-cli-primary">{aguardando}</p></div>
            <div className="bg-cli-card border border-cli-border rounded-xl p-5"><p className="text-cli-subtext text-xs font-semibold">Atendidos</p><p className="text-3xl font-extrabold mt-2">{atendidos}</p></div>
          </div>
          <div className="flex flex-col md:flex-row gap-3 md:items-center md:justify-between mb-5">
            <div><h2 className="text-xl font-extrabold">Pacientes cadastrados</h2><p className="text-cli-subtext text-xs mt-1">Registros retornados pela API REST</p></div>
            <div className="flex flex-col sm:flex-row gap-2">
              <div className="flex items-center gap-2 bg-white border border-cli-border rounded-full px-4 text-cli-subtext"><Icons.Search/><input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar nome, CPF..." className="bg-transparent text-cli-ink py-2.5 text-sm outline-none w-full sm:w-48"/></div>
              <select value={filtro} onChange={e=>setFiltro(e.target.value)} className="bg-white border border-cli-border rounded-full px-4 py-2.5 text-sm outline-none"><option value="TODOS">Todos os status</option><option value="AGUARDANDO">Aguardando</option><option value="EM_ATENDIMENTO">Em atendimento</option><option value="ATENDIDO">Atendidos</option></select>
            </div>
          </div>
          {carregando&&pacientes.length===0?<div className="text-center py-16 text-cli-subtext">Carregando pacientes da API...</div>:filtrados.length===0?<div className="bg-cli-card border border-cli-border rounded-2xl p-12 text-center"><div className="text-cli-primary flex justify-center mb-4"><Icons.Cross size={42}/></div><h3 className="font-extrabold text-lg">{statusApi==='erro'?'Não foi possível carregar os pacientes':'Nenhum paciente encontrado'}</h3><p className="text-cli-subtext text-sm mt-2">{statusApi==='erro'?'Verifique a conexão com o backend.':'Cadastre o primeiro paciente ou altere os filtros da busca.'}</p><button onClick={novo} className="mt-5 inline-flex items-center gap-2 rounded-full bg-cli-primary text-white px-5 py-3 font-extrabold text-sm hover:bg-cli-hover"><Icons.Plus/> Cadastrar paciente</button></div>:
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">{filtrados.map((p,i)=>{const st=STATUS[p.statusAtendimento];const ida=idade(p.dataNascimento);return <article key={p.id??i} className="bg-cli-card border border-cli-border rounded-2xl p-5 hover:bg-cli-cardHover transition">
            <div className="flex justify-between items-start gap-3"><div className="flex gap-3 min-w-0"><div className="w-12 h-12 shrink-0 rounded-xl bg-cli-soft text-cli-primary flex items-center justify-center"><Icons.Cross size={25}/></div><div className="min-w-0"><h3 className="font-extrabold text-lg truncate">{p.nome||'Sem nome'}</h3><p className="text-cli-subtext text-xs mt-1">{ida!==null?ida+' anos':'Idade não informada'}{p.convenio?' · '+p.convenio.replace(/_/g,' '):''}</p></div></div><span className="text-[10px] font-bold bg-cli-soft text-cli-primary px-2 py-1 rounded-full">#{p.id??'—'}</span></div>
            {st&&<span className={`inline-block mt-4 text-[11px] font-bold px-2.5 py-1 rounded-full ${st.c}`}>{st.l}</span>}
            <div className="grid grid-cols-2 gap-3 mt-4 text-xs"><div className="bg-cli-bg rounded-lg p-3"><p className="text-cli-subtext mb-1">Sexo</p><b>{SEXO[p.sexo]||'Não informado'}</b></div><div className="bg-cli-bg rounded-lg p-3"><p className="text-cli-subtext mb-1">Tipo sanguíneo</p><b>{p.tipoSanguineo||'Não informado'}</b></div><div className="bg-cli-bg rounded-lg p-3"><p className="text-cli-subtext mb-1">Telefone</p><b>{p.telefone||'Não informado'}</b></div><div className="bg-cli-bg rounded-lg p-3"><p className="text-cli-subtext mb-1">Peso</p><b>{p.peso!=null&&p.peso!==''?p.peso+' kg':'Não informado'}</b></div></div>
            {p.alergias&&<p className="text-xs text-rose-700 bg-rose-50 rounded-lg px-3 py-2 mt-3 line-clamp-1"><b>Alergias:</b> {p.alergias}</p>}
            {p.observacoes&&<p className="text-xs text-cli-subtext mt-3 line-clamp-2">{p.observacoes}</p>}
            <div className="flex gap-2 mt-5 pt-4 border-t border-cli-border"><button onClick={()=>editar(p)} className="flex-1 flex items-center justify-center gap-2 rounded-lg border border-cli-border py-2.5 text-xs font-bold hover:bg-cli-soft"><Icons.Edit/> Editar</button><button onClick={()=>setDeletando(p.id)} className="flex-1 flex items-center justify-center gap-2 rounded-lg border border-rose-200 text-rose-600 py-2.5 text-xs font-bold hover:bg-rose-50"><Icons.Trash/> Excluir</button></div>
          </article>})}</div>}
          <p className="text-[11px] text-cli-subtext mt-6">Endpoint configurado: <code>{apiUrl}</code> · GET, POST, PUT e DELETE</p>
        </>:<section className="max-w-3xl mx-auto">
          <button onClick={()=>{setTela('principal');setEditando(null);setForm(EMPTY)}} className="text-cli-subtext hover:text-cli-ink text-sm mb-5">← Voltar para os pacientes</button>
          <div className="bg-cli-card border border-cli-border rounded-2xl overflow-hidden">
            <div className="hero p-6 md:p-8 border-b border-cli-border"><p className="text-cli-primary text-sm font-bold mb-2">Ficha do paciente</p><h1 className="text-2xl md:text-3xl font-extrabold">{editando!==null?'Editar paciente':'Cadastrar novo paciente'}</h1><p className="text-cli-subtext text-sm mt-2">Preencha as informações e salve diretamente na API.</p></div>
            <form onSubmit={salvar} className="p-6 md:p-8 space-y-5">
              <div><label className={label}>Nome completo *</label><input required value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} placeholder="Ex.: Maria da Silva" className={field}/></div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4"><div><label className={label}>CPF</label><input value={form.cpf} onChange={e=>setForm({...form,cpf:e.target.value})} placeholder="000.000.000-00" className={field}/></div><div><label className={label}>Telefone</label><input value={form.telefone} onChange={e=>setForm({...form,telefone:e.target.value})} placeholder="(11) 90000-0000" className={field}/></div></div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4"><div><label className={label}>Sexo</label><select value={form.sexo} onChange={e=>setForm({...form,sexo:e.target.value})} className={field}><option value="">Não informado</option><option value="FEMININO">Feminino</option><option value="MASCULINO">Masculino</option><option value="OUTRO">Outro</option></select></div><div><label className={label}>Data de nascimento</label><input type="date" value={form.dataNascimento} onChange={e=>setForm({...form,dataNascimento:e.target.value})} className={field}/></div></div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4"><div><label className={label}>Convênio</label><select value={form.convenio} onChange={e=>setForm({...form,convenio:e.target.value})} className={field}><option value="PARTICULAR">Particular</option><option value="SUS">SUS</option><option value="PLANO_DE_SAUDE">Plano de saúde</option></select></div><div><label className={label}>Tipo sanguíneo</label><select value={form.tipoSanguineo} onChange={e=>setForm({...form,tipoSanguineo:e.target.value})} className={field}><option value="">Não informado</option>{['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(t=><option key={t} value={t}>{t}</option>)}</select></div><div><label className={label}>Peso (kg)</label><input type="number" min="0" step="0.1" value={form.peso} onChange={e=>setForm({...form,peso:e.target.value})} placeholder="Ex.: 68.5" className={field}/></div></div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4"><div><label className={label}>Status do atendimento</label><select value={form.statusAtendimento} onChange={e=>setForm({...form,statusAtendimento:e.target.value})} className={field}><option value="AGUARDANDO">Aguardando</option><option value="EM_ATENDIMENTO">Em atendimento</option><option value="ATENDIDO">Atendido</option></select></div><div><label className={label}>Alergias</label><input value={form.alergias} onChange={e=>setForm({...form,alergias:e.target.value})} placeholder="Ex.: Dipirona, penicilina" className={field}/></div></div>
              <div><label className={label}>Observações clínicas</label><textarea rows="3" value={form.observacoes} onChange={e=>setForm({...form,observacoes:e.target.value})} placeholder="Queixa principal, condições crônicas, medicamentos em uso..." className={field}></textarea></div>
              <div className="flex flex-col-reverse sm:flex-row gap-3 pt-2"><button type="button" onClick={()=>{setTela('principal');setEditando(null);setForm(EMPTY)}} className="flex-1 py-3 rounded-full border border-cli-border font-bold text-sm hover:bg-cli-soft">Cancelar</button><button type="submit" className="flex-1 py-3 rounded-full bg-cli-primary hover:bg-cli-hover text-white font-extrabold text-sm">{editando!==null?'Salvar alterações (PUT)':'Cadastrar paciente (POST)'}</button></div>
            </form>
          </div>
        </section>}
      </div>
    </main>
    {showConfig&&<div className="fixed inset-0 z-50 bg-cli-deep/60 backdrop-blur-sm flex items-center justify-center p-4"><div className="modal max-w-lg w-full p-6 rounded-2xl space-y-5"><div className="flex justify-between items-center"><h3 className="font-extrabold">Configurar URL do Backend</h3><button onClick={()=>setShowConfig(false)} className="text-cli-subtext text-xl" aria-label="Fechar">×</button></div><p className="text-cli-subtext text-sm">Informe a rota base da API de pacientes. O front-end fará chamadas GET, POST, PUT e DELETE usando esse endpoint.</p><div><label className={label}>URL base da API</label><input value={urlEdit} onChange={e=>setUrlEdit(e.target.value)} placeholder="http://localhost:8080/api/pacientes" className={field}/></div><div className="flex gap-3"><button onClick={()=>setShowConfig(false)} className="flex-1 py-3 rounded-full border border-cli-border font-bold text-sm hover:bg-cli-soft">Cancelar</button><button onClick={()=>{if(urlEdit.trim()){setApiUrl(urlEdit.trim().replace(/\/$/,''));setShowConfig(false)}}} className="flex-1 py-3 rounded-full bg-cli-primary hover:bg-cli-hover text-white font-extrabold text-sm">Salvar e testar conexão</button></div></div></div>}
    {deletando!==null&&<div className="fixed inset-0 z-50 bg-cli-deep/60 backdrop-blur-sm flex items-center justify-center p-4"><div className="modal max-w-sm w-full p-6 rounded-2xl text-center space-y-5"><div className="mx-auto w-12 h-12 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center"><Icons.Trash size={22}/></div><h3 className="font-extrabold text-lg">Excluir este paciente?</h3><p className="text-cli-subtext text-sm">A exclusão enviará <code className="text-rose-600">DELETE {apiUrl}/{deletando}</code> para sua API.</p><div className="flex gap-3"><button onClick={()=>setDeletando(null)} className="flex-1 py-3 rounded-full bg-cli-soft font-bold text-sm">Cancelar</button><button onClick={()=>excluir(deletando)} className="flex-1 py-3 rounded-full bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-sm">Excluir</button></div></div></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
